# Single source of truth for data sources, thresholds, rates and scenarios.
# Nothing in the code should hard-code a value that lives here.

state: MO

data:
  raw_dir: data/raw
  db_path: data/hospitals.duckdb
  report_dir: reports
  # CMS "Hospital Provider Cost Report". The year is the CMS file label: it holds
  # cost reports whose fiscal year BEGINS in that federal fiscal year (Oct 2023 - Sep 2024).
  cost_report_year: 2024
  # Raw HCRIS (Form CMS-2552-10) for the same federal fiscal year. Supplies interest
  # expense and accumulated depreciation, which the public-use file leaves out.
  hcris_url: "https://downloads.cms.gov/FILES/HCRIS/HOSP10FY2024.ZIP"
  # When HCRIS holds a newer version of a report than the public-use file, take the
  # overlapping fields from HCRIS so every input comes from the same version.
  prefer_hcris_when_versions_differ: true
  cost_report_url: "https://data.cms.gov/sites/default/files/2026-10/46b1f5a0-a9dd-4431-beee-2ee7194b4135/CostReport_2024_Final.csv"
  # CMS "Hospital General Information" (Care Compare), dataset xubh-q36u.
  hgi_url: "https://data.cms.gov/provider-data/sites/default/files/resources/893c372430d9d71a1c52737d01239d47_1785189955/Hospital_General_Information.csv"

# Which hospitals are analysed (Phase 2 onward).
scope:
  # CMS "CCN Facility Type": STH = short-term acute, CAH = critical access.
  # Missouri's one Rural Emergency Hospital is coded STH, so it is included.
  # Left out: PH psychiatric, LTCH long-term care, RH rehabilitation, CH children's.
  facility_types: [STH, CAH]
  # A report shorter than this is too short to scale up to a year and is dropped.
  min_period_days: 180

# Methodology choices for the financial metrics (Phase 2).
metrics:
  days_in_year: 365
  # false: operating revenue = net patient revenue only.
  # true:  operating revenue = net patient revenue + total other income
  #        (other income mixes operating items with investment gains and donations).
  operating_revenue_includes_other_income: false
  # A blank line is read as zero when the hospital filed that statement
  # (balance sheet lines need total assets; income lines need net income).
  blank_lines_are_zero_when_statement_filed: true
  # ASSUMPTION: a hospital that reports no interest and shows no debt on its balance
  # sheet pays zero interest. Others with no reported interest stay blank.
  assume_zero_interest_when_no_debt: true

# Stress test (Phase 3). Every number here is an ASSUMPTION to tune, not a forecast.
stress:
  # Required cushion: EBIDA must be at least this multiple of total debt payments.
  target_dscr: 1.25
  # Share of cash operating expenses that falls in step with patient volume.
  variable_cost_share: 0.40
  # Each scenario lists the shocks it applies; a shock left out is zero.
  #   medicaid_cut:   fractional fall in Medicaid net revenue
  #   volume_drop:    fractional fall in net patient revenue
  #   labor_increase: fractional rise in salary expense
  scenarios:
    medicaid_cut: {medicaid_cut: 0.10}
    volume_drop: {volume_drop: 0.10}
    labor_shock: {labor_increase: 0.05}
    combined: {medicaid_cut: 0.10, volume_drop: 0.10, labor_increase: 0.05}

# Capital types. Rate and term turn an annual payment into a principal amount.
# PLACEHOLDERS: illustrative values only, NOT official program terms or current
# market rates. Verify each against the real program before relying on it.
capital_types:
  usda_community_facilities: {label: "USDA Community Facilities loan", annual_rate: 0.040, term_years: 35}
  cdfi_nmtc: {label: "CDFI / New Markets Tax Credit loan", annual_rate: 0.050, term_years: 20}
  hud_242: {label: "HUD Section 242 insured mortgage", annual_rate: 0.055, term_years: 25}
  bank_loan: {label: "Bank loan", annual_rate: 0.070, term_years: 10}
  tax_exempt_bonds: {label: "Tax-exempt municipal bonds", annual_rate: 0.045, term_years: 30}
  sale_leaseback: {label: "Sale-leaseback / REIT (rent treated as the payment)", annual_rate: 0.075, term_years: 20}

quality:
  # A cost report covering fewer/more days than this is flagged as partial/odd-length.
  full_year_min_days: 360
  full_year_max_days: 371
  # Balance sheet is flagged if assets differ from liabilities + fund balances by more than this ($).
  balance_tolerance_dollars: 1000
